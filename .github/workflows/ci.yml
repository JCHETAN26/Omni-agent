name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    name: Python (lint, tests, audit)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            backend/requirements.txt
            search/requirements.txt
            model_server/requirements.txt
      - uses: azure/setup-helm@v5
        with:
          version: v3.17.3 # chart tests compare rendered output with the committed manifests
      - name: System packages (OpenCV headers for the C++ extension, redis-server for the replica test)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends libopencv-dev redis-server
      - name: Install
        run: |
          python -m pip install --upgrade pip
          # CPU-only torch first: the default Linux wheel pulls multi-GB CUDA libraries.
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-dev.txt pip-audit
          pip install ./native/vision
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Tests (fast suite; "slow" tests download the real MiniLM model)
        run: pytest -m "not slow" -q
      - name: Dependency audit (installed environment)
        run: pip-audit --progress-spinner off

  go:
    name: Go (${{ matrix.module }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        module: [cli, ingestion, controlplane]
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"
          cache-dependency-path: ${{ matrix.module }}/go.sum
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: vet
        run: go vet ./...
      - name: test
        run: go test -race ./...
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  operator:
    name: Go (operator, envtest)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: operator
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"
          cache-dependency-path: |
            operator/go.sum
            controlplane/go.sum
      - name: Generate, vet and test against a real kube-apiserver (envtest)
        run: make test
      - name: Generated code and manifests are committed
        run: git diff --exit-code -- . ':!cover.out'
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  frontend:
    name: Frontend (lint, typecheck, build, tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npx vitest run

  security:
    name: Security (omni check)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"
          cache-dependency-path: cli/go.sum
      - name: Build omni
        working-directory: cli
        run: go build -o bin/omni ./cmd/omni
      - name: Secrets, Dockerfile and Kubernetes hardening rules
        # External tools run in the jobs above (govulncheck, pip-audit, ruff, gofmt, go vet).
        run: cli/bin/omni check --fast .
