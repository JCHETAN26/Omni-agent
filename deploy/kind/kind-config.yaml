# Single-node kind cluster for the full OmniAgent stack with real Triton.
# The backend's NodePort (backend-nodeport.yaml) is mapped to localhost:8080 so
# load tests reach the pods directly, not through `kubectl port-forward`.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: omniagent
nodes:
  - role: control-plane
    extraPortMappings:
      - { containerPort: 30080, hostPort: 8080, listenAddress: "127.0.0.1", protocol: TCP }
