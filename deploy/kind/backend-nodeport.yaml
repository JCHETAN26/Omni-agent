# Exposes the backend on the kind node's port 30080 (mapped to localhost:8080).
apiVersion: v1
kind: Service
metadata:
  name: omniagent-backend-nodeport
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: omniagent
    app.kubernetes.io/instance: omniagent
    app.kubernetes.io/component: backend
  ports:
    - { name: http, port: 8000, targetPort: 8000, nodePort: 30080 }
