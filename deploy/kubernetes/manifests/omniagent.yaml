      app.kubernetes.io/instance: omniagent
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        helm.sh/chart: omniagent-0.4.0
        app.kubernetes.io/name: omniagent
        app.kubernetes.io/instance: omniagent
        app.kubernetes.io/version: "0.4.0"
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/part-of: omniagent
        app.kubernetes.io/component: backend
      annotations:
        checksum/config: a768389e73d69323695fbc52118b29a41bba4aac2724b561826e821d679fee29
        checksum/secret: a5711b76b6dd7745382848711a4bff4f31ad50b57c23011fee93f766e98a61ac
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: /metrics
    spec:
      serviceAccountName: omniagent
      terminationGracePeriodSeconds: 30
      securityContext:
        fsGroup: 10001
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
