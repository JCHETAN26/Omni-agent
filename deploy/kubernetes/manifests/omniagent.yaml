    nginx.ingress.kubernetes.io/proxy-body-size: 2m
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: nginx
  rules:
    - host: "omniagent.example.com"
      http:
        paths:
          # Only the client-facing gateway paths are public. /ingest, /search and
          # /metrics stay cluster-internal (no auth on them yet).
          - path: /ws
            pathType: Prefix
            backend:
              service: { name: omniagent-backend, port: { name: http } }
          - path: /sse
            pathType: Prefix
            backend:
              service: { name: omniagent-backend, port: { name: http } }
          - path: /health
            pathType: Exact
            backend:
              service: { name: omniagent-backend, port: { name: http } }
          - path: /
            pathType: Prefix
            backend:
              service: { name: omniagent-frontend, port: { name: http } }
---
# Source: omniagent/templates/seed-job.yaml
apiVersion: batch/v1
kind: Job
metadata:
  name: omniagent-seed
  labels:
    helm.sh/chart: omniagent-0.4.0
    app.kubernetes.io/name: omniagent
    app.kubernetes.io/instance: omniagent
    app.kubernetes.io/version: "0.4.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: omniagent
    app.kubernetes.io/component: seed
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 6                 # retries while datastores are still starting
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        helm.sh/chart: omniagent-0.4.0
        app.kubernetes.io/name: omniagent
        app.kubernetes.io/instance: omniagent
        app.kubernetes.io/version: "0.4.0"
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/part-of: omniagent
        app.kubernetes.io/component: seed
    spec:
      restartPolicy: OnFailure
      serviceAccountName: omniagent
      securityContext:
        fsGroup: 10001
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: seed
          image: "ghcr.io/jchetan26/omniagent-backend:0.4.0"
          command: ["python", "-m", "backend.ingestion.seed", "samples"]
          envFrom:
            - configMapRef:
                name: omniagent-config
            - secretRef:
                name: omniagent-secrets
          env:
            - name: POD_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
          resources:
            limits:
              cpu: "2"
              memory: 2Gi
            requests:
              cpu: 500m
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: {}
