apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: omniagent-elasticsearch
  labels:
    helm.sh/chart: omniagent-0.4.0
    app.kubernetes.io/name: omniagent
    app.kubernetes.io/instance: omniagent
    app.kubernetes.io/version: "0.4.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: omniagent
    app.kubernetes.io/component: elasticsearch
spec:
  serviceName: omniagent-elasticsearch-headless
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: omniagent
      app.kubernetes.io/instance: omniagent
      app.kubernetes.io/component: elasticsearch
  template:
    metadata:
      labels:
        helm.sh/chart: omniagent-0.4.0
        app.kubernetes.io/name: omniagent
        app.kubernetes.io/instance: omniagent
        app.kubernetes.io/version: "0.4.0"
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/part-of: omniagent
        app.kubernetes.io/component: elasticsearch
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: elasticsearch
          image: "docker.elastic.co/elasticsearch/elasticsearch:9.5.6"
          ports:
            - { name: http, containerPort: 9200 }
          env:
            - { name: discovery.type, value: single-node }
            - { name: xpack.security.enabled, value: "false" }
            - { name: xpack.ml.enabled, value: "false" }
            # No mmap: avoids the privileged vm.max_map_count sysctl init container.
            - { name: node.store.allow_mmap, value: "false" }
            - name: ES_JAVA_OPTS
              value: "-Xms1g -Xmx1g"
          readinessProbe:
            httpGet: { path: "/_cluster/health?wait_for_status=yellow&timeout=1s", port: http }
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            tcpSocket: { port: http }
            initialDelaySeconds: 60
            periodSeconds: 20
          resources:
            limits:
              cpu: "2"
              memory: 2Gi
            requests:
              cpu: 500m
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: data, mountPath: /usr/share/elasticsearch/data }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        resources: { requests: { storage: 10Gi } }
