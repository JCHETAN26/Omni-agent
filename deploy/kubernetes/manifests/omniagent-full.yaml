# Source: omniagent/templates/ingress.yaml
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: omniagent
  labels:
    helm.sh/chart: omniagent-0.4.0
    app.kubernetes.io/name: omniagent
    app.kubernetes.io/instance: omniagent
    app.kubernetes.io/version: "0.4.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: omniagent
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 2m
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: nginx
  rules:
    - host: "omniagent.example.com"
      http:
        paths:
          # Only the client-facing gateway paths are public (/rooms: incident-room
          # creation and snapshots). /ingest, /search and /metrics stay
          # cluster-internal (no auth on them yet).
          - path: /ws
            pathType: Prefix
            backend:
              service: { name: omniagent-backend, port: { name: http } }
          - path: /sse
            pathType: Prefix
            backend:
              service: { name: omniagent-backend, port: { name: http } }
          - path: /rooms
            pathType: Prefix
            backend:
              service: { name: omniagent-backend, port: { name: http } }
          - path: /health
            pathType: Exact
            backend:
              service: { name: omniagent-backend, port: { name: http } }
          - path: /
            pathType: Prefix
            backend:
              service: { name: omniagent-frontend, port: { name: http } }
