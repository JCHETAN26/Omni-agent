# gRPC control plane (omni.control.v1): stateless nodes in front of the gateway
# pods. Clients resolve the headless Service and fail over between nodes;
# nodes find each other through the same Service and exchange heartbeats.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: omniagent-controlplane
  labels:
    helm.sh/chart: omniagent-0.4.0
    app.kubernetes.io/name: omniagent
    app.kubernetes.io/instance: omniagent
    app.kubernetes.io/version: "0.4.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: omniagent
    app.kubernetes.io/component: controlplane
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: omniagent
      app.kubernetes.io/instance: omniagent
      app.kubernetes.io/component: controlplane
  strategy:
    # Never take a node away before its replacement is ready.
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  template:
    metadata:
      labels:
        helm.sh/chart: omniagent-0.4.0
        app.kubernetes.io/name: omniagent
        app.kubernetes.io/instance: omniagent
        app.kubernetes.io/version: "0.4.0"
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/part-of: omniagent
        app.kubernetes.io/component: controlplane
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
    spec:
      automountServiceAccountToken: false
      # SIGTERM: NOT_SERVING for DRAIN_SECONDS, then in-flight calls finish.
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: omniagent
              app.kubernetes.io/instance: omniagent
              app.kubernetes.io/component: controlplane
      containers:
        - name: controlplane
          image: "ghcr.io/jchetan26/omniagent-controlplane:0.4.0"
          imagePullPolicy: IfNotPresent
          command: ["/omni-controlplane"]
          env:
            - { name: GATEWAY_HOST, value: "omniagent-gateway-endpoints" }
            - { name: GATEWAY_PORT, value: "8000" }
            - { name: PEER_HOST, value: "omniagent-controlplane" }
            - { name: HEARTBEAT_MS, value: "500" }
            - { name: DEAD_AFTER, value: "3" }
            - { name: MAX_ATTEMPTS, value: "3" }
            - { name: PER_TRY_TIMEOUT_MS, value: "2000" }
            - { name: ELASTICSEARCH_URL, value: "http://omniagent-elasticsearch:9200" }
            - name: ELASTICSEARCH_API_KEY
              valueFrom: { secretKeyRef: { name: omniagent-secrets, key: ELASTICSEARCH_API_KEY, optional: true } }
            - name: POD_IP
              valueFrom: { fieldRef: { fieldPath: status.podIP } }
            - name: NODE_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
          ports:
            - { name: grpc, containerPort: 9000 }
            - { name: metrics, containerPort: 9090 }
          readinessProbe:
            grpc: { port: 9000, service: omni.control.v1.Router }
            periodSeconds: 2
          livenessProbe:
            grpc: { port: 9000 }
            periodSeconds: 10
          resources:
            limits:
              cpu: 500m
              memory: 128Mi
            requests:
              cpu: 50m
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
