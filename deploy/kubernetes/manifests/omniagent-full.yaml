apiVersion: apps/v1
kind: Deployment
metadata:
  name: omniagent-triton
  labels:
    helm.sh/chart: omniagent-0.4.0
    app.kubernetes.io/name: omniagent
    app.kubernetes.io/instance: omniagent
    app.kubernetes.io/version: "0.4.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: omniagent
    app.kubernetes.io/component: triton
spec:
  replicas: 1
  # One large inference server: a rolling update would need room for two copies
  # (CPU/memory or a second GPU) and stalls on a full node, so replace in place.
  strategy: { type: Recreate }
  selector:
    matchLabels:
      app.kubernetes.io/name: omniagent
      app.kubernetes.io/instance: omniagent
      app.kubernetes.io/component: triton
  template:
    metadata:
      labels:
        helm.sh/chart: omniagent-0.4.0
        app.kubernetes.io/name: omniagent
        app.kubernetes.io/instance: omniagent
        app.kubernetes.io/version: "0.4.0"
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/part-of: omniagent
        app.kubernetes.io/component: triton
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8002"
    spec:
      automountServiceAccountToken: false
      securityContext:
        # NGC Triton images ship a non-root "triton-server" user (UID 1000).
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: triton
          image: "ghcr.io/jchetan26/omniagent-triton:0.4.0"
          imagePullPolicy: IfNotPresent
          # Models come from a PVC (modelRepositoryClaim) or are baked into the
          # image at /models (deploy/docker/triton.Dockerfile).
          args: ["tritonserver", "--model-repository=/models", "--strict-readiness=true"]
          ports:
            - { name: http, containerPort: 8000 }
            - { name: grpc, containerPort: 8001 }
            - { name: metrics, containerPort: 8002 }
          readinessProbe:
            httpGet: { path: /v2/health/ready, port: http }
            periodSeconds: 5
          startupProbe:
            httpGet: { path: /v2/health/ready, port: http }
            periodSeconds: 5
            failureThreshold: 60      # model loading can take minutes on CPU
          livenessProbe:
            httpGet: { path: /v2/health/live, port: http }
            periodSeconds: 15
          resources:
            limits:
              cpu: "4"
              memory: 4Gi
            requests:
              cpu: "1"
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: shm, mountPath: /dev/shm }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: shm
          emptyDir: { medium: Memory, sizeLimit: 1Gi }
        - name: tmp
          emptyDir: {}
