{{- if .Values.elasticsearch.enabled }}
{{- $fullname := include "omniagent.fullname" . -}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $fullname }}-elasticsearch
  labels: {{- include "omniagent.componentLabels" (list . "elasticsearch") | nindent 4 }}
spec:
  serviceName: {{ $fullname }}-elasticsearch-headless
  replicas: 1
  selector:
    matchLabels: {{- include "omniagent.selector" (list . "elasticsearch") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "omniagent.componentLabels" (list . "elasticsearch") | nindent 8 }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: elasticsearch
          image: "{{ .Values.elasticsearch.image.repository }}:{{ .Values.elasticsearch.image.tag }}"
          ports:
            - { name: http, containerPort: 9200 }
          env:
            - { name: discovery.type, value: single-node }
            - { name: xpack.security.enabled, value: "false" }
            - { name: xpack.ml.enabled, value: "false" }
            # No mmap: avoids the privileged vm.max_map_count sysctl init container.
            - { name: node.store.allow_mmap, value: "false" }
            - name: ES_JAVA_OPTS
              value: "-Xms{{ .Values.elasticsearch.heapSize }} -Xmx{{ .Values.elasticsearch.heapSize }}"
          readinessProbe:
            httpGet: { path: "/_cluster/health?wait_for_status=yellow&timeout=1s", port: http }
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            tcpSocket: { port: http }
            initialDelaySeconds: 60
            periodSeconds: 20
          resources: {{- toYaml .Values.elasticsearch.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: data, mountPath: /usr/share/elasticsearch/data }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        {{- with .Values.elasticsearch.persistence.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        resources: { requests: { storage: {{ .Values.elasticsearch.persistence.size }} } }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}-elasticsearch-headless
  labels: {{- include "omniagent.componentLabels" (list . "elasticsearch") | nindent 4 }}
spec:
  clusterIP: None
  selector: {{- include "omniagent.selector" (list . "elasticsearch") | nindent 4 }}
  ports:
    - { name: http, port: 9200 }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}-elasticsearch
  labels: {{- include "omniagent.componentLabels" (list . "elasticsearch") | nindent 4 }}
spec:
  selector: {{- include "omniagent.selector" (list . "elasticsearch") | nindent 4 }}
  ports:
    - { name: http, port: 9200, targetPort: http }
{{- end }}
