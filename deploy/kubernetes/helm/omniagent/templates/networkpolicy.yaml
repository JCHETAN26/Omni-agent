{{- if .Values.networkPolicy.enabled }}
{{- $root := . -}}
{{- range $store, $port := dict "qdrant" 6333 "elasticsearch" 9200 "redis" 6379 "triton" 8001 }}
{{- if (index $root.Values $store).enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "omniagent.fullname" $root }}-{{ $store }}
  labels: {{- include "omniagent.componentLabels" (list $root $store) | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "omniagent.selector" (list $root $store) | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        {{- range $client := list "backend" "seed" }}
        - podSelector:
            matchLabels: {{- include "omniagent.selector" (list $root $client) | nindent 14 }}
        {{- end }}
      ports:
        - { port: {{ $port }}, protocol: TCP }
        {{- if eq $store "qdrant" }}
        - { port: 6334, protocol: TCP }
        {{- end }}
    {{- if and (eq $store "triton") $root.Values.networkPolicy.metricsFrom }}
    # Triton's Prometheus endpoint, for the scraper only.
    - from: {{- toYaml $root.Values.networkPolicy.metricsFrom | nindent 8 }}
      ports:
        - { port: 8002, protocol: TCP }
    {{- end }}
{{- end }}
{{- end }}
{{- end }}
