{{- if .Values.kafka.enabled }}
{{- $fullname := include "omniagent.fullname" . -}}
{{- $headless := printf "%s-kafka-headless" $fullname -}}
{{- $replicas := int .Values.kafka.replicas -}}
{{- if ne $replicas 1 }}{{ fail "kafka.replicas: the bundled KRaft broker is single-node; use kafka.externalBrokers for a cluster" }}{{ end }}
# Single-node Apache Kafka in KRaft mode (combined broker + controller, no
# ZooKeeper). Durability: acks=all from the producers, data on a PVC. With one
# broker there is no replication: a lost volume loses the log. For production
# point kafka.externalBrokers at a replicated cluster (RF >= 3, min ISR 2).
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $fullname }}-kafka
  labels: {{- include "omniagent.componentLabels" (list . "kafka") | nindent 4 }}
data:
  server.properties: |
    process.roles=broker,controller
    node.id=1
    controller.quorum.voters=1@127.0.0.1:9093
    controller.listener.names=CONTROLLER
    listeners=PLAINTEXT://:9092,CONTROLLER://127.0.0.1:9093
    advertised.listeners=PLAINTEXT://{{ $fullname }}-kafka-0.{{ $headless }}.{{ .Release.Namespace }}.svc.cluster.local:9092
    listener.security.protocol.map=PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
    inter.broker.listener.name=PLAINTEXT
    log.dirs=/var/lib/kafka/data
    num.partitions={{ .Values.kafka.documentPartitions }}
    auto.create.topics.enable=false
    offsets.topic.replication.factor=1
    transaction.state.log.replication.factor=1
    transaction.state.log.min.isr=1
    share.coordinator.state.topic.replication.factor=1
    share.coordinator.state.topic.min.isr=1
    group.initial.rebalance.delay.ms=0
    log.retention.hours={{ .Values.kafka.retentionHours }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $fullname }}-kafka
  labels: {{- include "omniagent.componentLabels" (list . "kafka") | nindent 4 }}
spec:
  serviceName: {{ $headless }}
  replicas: 1
  selector:
    matchLabels: {{- include "omniagent.selector" (list . "kafka") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "omniagent.componentLabels" (list . "kafka") | nindent 8 }}
      annotations:
        checksum/config: {{ .Values.kafka | toJson | sha256sum }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        # apache/kafka runs as "appuser" (UID/GID 1000).
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      initContainers:
        # Format the KRaft log directory once; a no-op on restarts.
        - name: format
          image: "{{ .Values.kafka.image.repository }}:{{ .Values.kafka.image.tag }}"
          command: ["/opt/kafka/bin/kafka-storage.sh", "format", "--ignore-formatted",
                    "-t", {{ .Values.kafka.clusterId | quote }}, "-c", "/config/server.properties"]
          env:
            - { name: LOG_DIR, value: /tmp/kafka-logs }
          resources: {{- toYaml .Values.kafka.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: data, mountPath: /var/lib/kafka/data }
            - { name: config, mountPath: /config, readOnly: true }
            - { name: tmp, mountPath: /tmp }
      containers:
        - name: kafka
          image: "{{ .Values.kafka.image.repository }}:{{ .Values.kafka.image.tag }}"
          command: ["/opt/kafka/bin/kafka-server-start.sh", "/config/server.properties"]
          env:
            - { name: LOG_DIR, value: /tmp/kafka-logs }
            - { name: KAFKA_HEAP_OPTS, value: {{ .Values.kafka.heapOpts | quote }} }
          ports:
            - { name: kafka, containerPort: 9092 }
          readinessProbe:
            tcpSocket: { port: kafka }
            periodSeconds: 5
          livenessProbe:
            tcpSocket: { port: kafka }
            initialDelaySeconds: 30
            periodSeconds: 15
          resources: {{- toYaml .Values.kafka.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: data, mountPath: /var/lib/kafka/data }
            - { name: config, mountPath: /config, readOnly: true }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: config
          configMap: { name: {{ $fullname }}-kafka }
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        {{- with .Values.kafka.persistence.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        resources: { requests: { storage: {{ .Values.kafka.persistence.size }} } }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $headless }}
  labels: {{- include "omniagent.componentLabels" (list . "kafka") | nindent 4 }}
spec:
  clusterIP: None
  # Clients resolve the advertised per-pod name while the broker is starting.
  publishNotReadyAddresses: true
  selector: {{- include "omniagent.selector" (list . "kafka") | nindent 4 }}
  ports:
    - { name: kafka, port: 9092 }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}-kafka
  labels: {{- include "omniagent.componentLabels" (list . "kafka") | nindent 4 }}
spec:
  selector: {{- include "omniagent.selector" (list . "kafka") | nindent 4 }}
  ports:
    - { name: kafka, port: 9092, targetPort: kafka }
{{- end }}
