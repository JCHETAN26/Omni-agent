{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "omniagent.secretName" . }}
  labels: {{- include "omniagent.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $k, $v := .Values.secrets.values }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
  {{- if and (not .Values.redis.enabled) (contains "@" .Values.redis.externalUrl) }}
  # External Redis URL carries credentials: keep it out of the ConfigMap.
  REDIS_URL: {{ .Values.redis.externalUrl | quote }}
  {{- end }}
{{- end }}
