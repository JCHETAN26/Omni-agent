{{- if .Values.redis.enabled }}
{{- $fullname := include "omniagent.fullname" . -}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $fullname }}-redis
  labels: {{- include "omniagent.componentLabels" (list . "redis") | nindent 4 }}
spec:
  serviceName: {{ $fullname }}-redis-headless
  replicas: 1
  selector:
    matchLabels: {{- include "omniagent.selector" (list . "redis") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "omniagent.componentLabels" (list . "redis") | nindent 8 }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        fsGroup: 999
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: redis
          image: "{{ .Values.redis.image.repository }}:{{ .Values.redis.image.tag }}"
          # AOF persistence: conversation memory and rate-limit buckets survive restarts.
          args: ["--appendonly", "yes", "--appendfsync", "everysec", "--dir", "/data",
                 "--maxmemory-policy", "volatile-lru"]
          ports:
            - { name: redis, containerPort: 6379 }
          readinessProbe:
            exec: { command: [redis-cli, ping] }
            periodSeconds: 5
          livenessProbe:
            tcpSocket: { port: redis }
            periodSeconds: 15
          resources: {{- toYaml .Values.redis.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: data, mountPath: /data }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        {{- with .Values.redis.persistence.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        resources: { requests: { storage: {{ .Values.redis.persistence.size }} } }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}-redis-headless
  labels: {{- include "omniagent.componentLabels" (list . "redis") | nindent 4 }}
spec:
  clusterIP: None
  selector: {{- include "omniagent.selector" (list . "redis") | nindent 4 }}
  ports:
    - { name: redis, port: 6379 }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}-redis
  labels: {{- include "omniagent.componentLabels" (list . "redis") | nindent 4 }}
spec:
  selector: {{- include "omniagent.selector" (list . "redis") | nindent 4 }}
  ports:
    - { name: redis, port: 6379, targetPort: redis }
{{- end }}
