{{- if .Values.ingress.enabled }}
{{- $fullname := include "omniagent.fullname" . -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $fullname }}
  labels: {{- include "omniagent.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts: [{{ .Values.ingress.host | quote }}]
      secretName: {{ .Values.ingress.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          # Only the client-facing gateway paths are public (/rooms: incident-room
          # creation and snapshots). /ingest, /search and /metrics stay
          # cluster-internal (no auth on them yet).
          {{- range list "/ws" "/sse" "/rooms" }}
          - path: {{ . }}
            pathType: Prefix
            backend:
              service: { name: {{ $fullname }}-backend, port: { name: http } }
          {{- end }}
          - path: /health
            pathType: Exact
            backend:
              service: { name: {{ $fullname }}-backend, port: { name: http } }
          {{- if .Values.frontend.enabled }}
          - path: /
            pathType: Prefix
            backend:
              service: { name: {{ $fullname }}-frontend, port: { name: http } }
          {{- end }}
{{- end }}
